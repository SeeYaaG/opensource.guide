title: Open Source Guides
description: Learn how to launch and grow your project.

exclude:
  - bin
  - CNAME
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - docs
  - Gemfile*
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - script
  - test
  - vendor

permalink: "/:path:/"

collections:
  articles:
    output: true
    permalink: "/:path:/"

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/cards/default.png
  - scope:
      path: ""
      type: articles
    values:
      layout: article

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sass_dir: assets/css/
  style: compressed
  load_paths:
    - node_modules

logo: /assets/images/cards/default.png

# ============================================================================
# SITE CONFIGURATION - Update these values for your fork/deployment
# ============================================================================
# WARNING: These values contain sensitive configuration. See SECURITY.md
# for details on what needs to be updated when deploying this site.

site_config:
  # Repository information - Update to your fork
  repository_owner: SeeYaaG
  repository_name: opensource.guide
  repository_nwo: SeeYaaG/opensource.guide
  repository_url: https://github.com/SeeYaaG/opensource.guide
  default_branch: main
  
  # Social media accounts - Update to your handles
  twitter:
    username: github  # TODO: Update to your Twitter handle
  
  facebook:
    publisher: https://www.facebook.com/GitHub/  # TODO: Update to your Facebook page
  
  # Search and analytics - Update tokens from your accounts
  google:
    site_verification: c1kuD-K2HIVF635lypcsWPoD4kilo5-jA_wBFyT4uMY  # TODO: Replace with your Google Search Console token
  
  # Email subscription service - Update with your MailChimp account
  mailchimp:
    account_id: 9d7ced8c4bbd6c2f238673f0f  # TODO: Replace with your MailChimp account ID
    form_id: b514344ba3  # TODO: Replace with your MailChimp form ID
    endpoint: "//github.us11.list-manage.com/subscribe/post"  # Update region if needed
    timezone: "US/Eastern"  # TODO: Update to your timezone
  
  # Locale configuration
  default_locale: en
  fallback_locale: en

# ============================================================================
# Legacy GitHub configuration (maintained for compatibility)
# Use site_config above for new references
# ============================================================================

github:
  repository_nwo: "{{ site.site_config.repository_nwo }}"

twitter:
  username: "{{ site.site_config.twitter.username }}"

facebook:
  publisher: "{{ site.site_config.facebook.publisher }}"
